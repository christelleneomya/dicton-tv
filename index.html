<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Dicton du jour</title>

<link rel="preconnect" href="https://api.allorigins.win">
<link rel="preconnect" href="https://r.jina.ai">
<link rel="dns-prefetch" href="//api.allorigins.win">
<link rel="dns-prefetch" href="//r.jina.ai">

<style>
  :root{
    --bg:#fbf7f0;
    --bg2:#fffdf9;
    --ink:#2b231b;
    --muted:#7b6a5a;
    --line:#eadfd2;
    --accent:#b65c3a;
    --accent2:#d8a15f;
    --chip:#f3ede3;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:56px;
    background:
      radial-gradient(900px 520px at 12% 18%, rgba(216,161,95,.18), transparent 60%),
      radial-gradient(900px 520px at 88% 22%, rgba(182,92,58,.12), transparent 62%),
      linear-gradient(180deg, var(--bg), var(--bg2));
  }

  .frame{
    width:min(1500px, 96vw);
    border-radius:34px;
    padding:14px;
    background:linear-gradient(135deg, rgba(182,92,58,.55), rgba(216,161,95,.55));
    box-shadow:0 18px 45px rgba(43,35,27,.12);
  }

  .card{
    border-radius:26px;
    background:#ffffff;
    border:1px solid rgba(234,223,210,.9);
    overflow:hidden;
    position:relative;
  }

  .content{
    position:relative;
    padding:44px 62px 38px;
    text-align:center;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    margin-bottom:18px;
  }

  .date{
    font-size:42px;
    font-weight:700;
    color:var(--ink);
    text-transform:lowercase;
  }

  .badge{
    font-size:16px;
    font-weight:800;
    letter-spacing:.8px;
    text-transform:uppercase;
    padding:10px 14px;
    border-radius:999px;
    background:var(--chip);
    border:1px solid rgba(234,223,210,1);
    color:var(--muted);
    white-space:nowrap;
  }

  .clock{
    margin:20px auto 10px;
    display:inline-flex;
    align-items:baseline;
    justify-content:center;
    gap:12px;
    padding:18px 26px;
    border-radius:18px;
    background:rgba(243,237,227,.75);
    border:1px solid rgba(234,223,210,.95);
  }

  .timeMain{
    font-size:92px;
    font-weight:900;
    letter-spacing:1px;
    line-height:1;
    color:var(--ink);
  }

  .timeSec{
    font-size:34px;
    font-weight:800;
    color:var(--muted);
  }

  .rule{
    width:220px;
    height:6px;
    border-radius:99px;
    margin:26px auto 28px;
    background:linear-gradient(90deg, transparent, rgba(182,92,58,.30), rgba(216,161,95,.32), transparent);
  }

  .quoteWrap{
    max-width:1200px;
    margin:0 auto;
    padding:0 14px;
  }

  .quoteMark{
    font-size:54px;
    font-weight:900;
    line-height:1;
    color:rgba(182,92,58,.22);
    margin-bottom:6px;
  }

  .dicton{
    font-size:70px;
    font-weight:800;
    line-height:1.20;
    letter-spacing:.2px;
    hyphens:none;
    word-break:normal;
    overflow-wrap:normal;
    white-space:pre-line;
  }

  .meta{
    margin-top:22px;
    font-size:18px;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }

  .dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:linear-gradient(135deg, rgba(182,92,58,.75), rgba(216,161,95,.85));
  }

  @media (max-width:1100px){
    body{ padding:26px; }
    .content{ padding:30px 22px 26px; }
    .topbar{ flex-direction:column; gap:12px; }
    .date{ font-size:30px; }
    .timeMain{ font-size:70px; }
    .timeSec{ font-size:26px; }
    .dicton{ font-size:46px; }
  }
</style>
</head>

<body>
  <div class="frame">
    <div class="card">
      <div class="content">
        <div class="topbar">
          <div class="date" id="date">—</div>
          <div class="badge">Dicton du jour</div>
        </div>

        <div class="clock">
          <div class="timeMain" id="timeMain">—</div>
          <div class="timeSec" id="timeSec">—</div>
        </div>

        <div class="rule"></div>

        <div class="quoteWrap">
          <div class="quoteMark">“</div>
          <div class="dicton" id="dicton">Belle journée à toutes et tous.</div>
        </div>

        <div class="meta">
          <span class="dot"></span>
          <span>Source : saint-dicton.com</span>
        </div>
      </div>
    </div>
  </div>

<script>
  const TIMEZONE = "Europe/Paris";

  function updateTime(){
    const now = new Date();

    const dateText = new Intl.DateTimeFormat("fr-FR", {
      timeZone: TIMEZONE,
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    }).format(now);

    const timeText = new Intl.DateTimeFormat("fr-FR", {
      timeZone: TIMEZONE,
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    }).format(now);

    const parts = timeText.split(":");

    document.getElementById("date").textContent = dateText;
    document.getElementById("timeMain").textContent = parts[0] + ":" + parts[1];
    document.getElementById("timeSec").textContent = ":" + parts[2];
  }

  function startClock(){
    function tick(){
      updateTime();
      setTimeout(tick, 1000 - (Date.now() % 1000));
    }

    tick();
  }

  startClock();

  const KEY = "dicton_cache";
  const TS = "dicton_ts";
  const TTL = 6 * 60 * 60 * 1000;
  const FETCH_TIMEOUT = 8000;

  function getCache(){
    try{
      const text = localStorage.getItem(KEY);
      const ts = Number(localStorage.getItem(TS) || 0);
      if(!text) return null;
      return { text, ts };
    }catch(e){
      return null;
    }
  }

  function setCache(text){
    try{
      localStorage.setItem(KEY, text);
      localStorage.setItem(TS, String(Date.now()));
    }catch(e){}
  }

  async function fetchWithTimeout(url){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT);

    try{
      const response = await fetch(url, {
        signal: controller.signal,
        cache: "no-store"
      });

      if(!response.ok){
        throw new Error("Erreur réseau");
      }

      return response;
    }finally{
      clearTimeout(timer);
    }
  }

  async function fetchHtml(){
    const target = "https://www.saint-dicton.com/?t=" + Date.now();

    const allOrigins = async () => {
      const response = await fetchWithTimeout(
        "https://api.allorigins.win/get?url=" + encodeURIComponent(target)
      );
      const json = await response.json();
      return json.contents;
    };

    const jina = async () => {
      const clean = target.replace(/^https?:\/\//, "");
      const response = await fetchWithTimeout(
        "https://r.jina.ai/http://" + clean
      );
      return await response.text();
    };

    return await Promise.any([
      allOrigins(),
      jina()
    ]);
  }

  function extractDicton(html){
    const text = new DOMParser()
      .parseFromString(String(html), "text/html")
      .body
      .innerText;

    const lines = text
      .split("\n")
      .map(line => line.trim())
      .filter(Boolean);

    const index = lines.findIndex(line =>
      line.toLowerCase().includes("dicton du jour")
    );

    if(index === -1){
      return null;
    }

    const stopWords = [
      "prénoms à fêter",
      "phase de la lune",
      "fêtes du",
      "saints du calendrier",
      "haut de la page"
    ];

    const result = [];

    for(let i = index + 1; i < lines.length; i++){
      const line = lines[i];
      const lower = line.toLowerCase();

      if(stopWords.some(word => lower.includes(word))){
        break;
      }

      if(line.length > 2){
        result.push(line);
      }

      if(result.length >= 4){
        break;
      }
    }

    return result.join("\n").trim() || null;
  }

  async function loadDicton(){
    const el = document.getElementById("dicton");
    const cache = getCache();

    if(cache && cache.text){
      el.textContent = cache.text;
    }

    if(cache && Date.now() - cache.ts < TTL){
      return;
    }

    try{
      const html = await fetchHtml();
      const dicton = extractDicton(html);

      if(dicton){
        el.textContent = dicton;
        setCache(dicton);
      }
    }catch(error){
      console.log("Impossible de charger le dicton", error);
    }
  }

  loadDicton();

  setInterval(loadDicton, 60 * 60 * 1000);

  setInterval(() => {
    window.location.reload();
  }, 10 * 60 * 1000);
</script>
</body>
</html>
