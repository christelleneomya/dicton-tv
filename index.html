<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Dicton du jour</title>

<link rel="preconnect" href="https://api.allorigins.win">
<link rel="preconnect" href="https://r.jina.ai">
<link rel="dns-prefetch" href="//api.allorigins.win">
<link rel="dns-prefetch" href="//r.jina.ai">

<style>
  :root{
    --bg:#fbf7f0;
    --bg2:#fffdf9;
    --card:#ffffff;
    --ink:#2b231b;
    --muted:#7b6a5a;
    --line:#eadfd2;
    --accent:#b65c3a;
    --accent2:#d8a15f;
    --chip:#f3ede3;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:56px;
    background:
      radial-gradient(900px 520px at 12% 18%, rgba(216,161,95,.18), transparent 60%),
      radial-gradient(900px 520px at 88% 22%, rgba(182,92,58,.12), transparent 62%),
      linear-gradient(180deg, var(--bg), var(--bg2));
  }

  .frame{
    width:min(1500px, 96vw);
    border-radius:34px;
    padding:14px;
    background:linear-gradient(135deg, rgba(182,92,58,.55), rgba(216,161,95,.55));
    box-shadow:0 26px 70px rgba(43,35,27,.14);
  }

  .card{
    border-radius:26px;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(8px);
    border:1px solid rgba(234,223,210,.9);
    overflow:hidden;
    position:relative;
  }

  .card::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(700px 360px at 20% 18%, rgba(216,161,95,.10), transparent 60%),
      radial-gradient(700px 360px at 85% 22%, rgba(182,92,58,.08), transparent 62%);
    pointer-events:none;
  }

  .content{
    position:relative;
    padding:44px 62px 38px;
    text-align:center;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    margin-bottom:18px;
  }

  .date{
    font-size:42px;
    font-weight:700;
    color:var(--ink);
    text-transform:lowercase;
  }

  .badge{
    font-size:16px;
    font-weight:800;
    letter-spacing:.8px;
    text-transform:uppercase;
    padding:10px 14px;
    border-radius:999px;
    background:var(--chip);
    border:1px solid rgba(234,223,210,1);
    color:var(--muted);
    white-space:nowrap;
  }

  .clock{
    margin:20px auto 10px;
    display:inline-flex;
    align-items:baseline;
    justify-content:center;
    gap:12px;
    padding:18px 26px;
    border-radius:18px;
    background:rgba(243,237,227,.75);
    border:1px solid rgba(234,223,210,.95);
  }

  .timeMain{
    font-size:92px;
    font-weight:900;
    letter-spacing:1px;
    line-height:1;
    color:var(--ink);
  }

  .timeSec{
    font-size:34px;
    font-weight:800;
    color:var(--muted);
  }

  .rule{
    width:220px;
    height:6px;
    border-radius:99px;
    margin:26px auto 28px;
    background:linear-gradient(90deg, transparent, rgba(182,92,58,.30), rgba(216,161,95,.32), transparent);
  }

  .quoteWrap{
    max-width:1200px;
    margin:0 auto;
    padding:0 14px;
  }

  .quoteMark{
    font-size:54px;
    font-weight:900;
    line-height:1;
    color:rgba(182,92,58,.22);
    margin-bottom:6px;
  }

  .dicton{
    font-size:70px;
    font-weight:800;
    line-height:1.20;
    letter-spacing:.2px;
    hyphens:none;
    word-break:normal;
    overflow-wrap:normal;
    white-space:pre-line;
  }

  .meta{
    margin-top:22px;
    font-size:18px;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }

  .dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:linear-gradient(135deg, rgba(182,92,58,.75), rgba(216,161,95,.85));
  }

  @media (max-width:1100px){
    body{ padding:26px; }
    .content{ padding:30px 22px 26px; }
    .topbar{ flex-direction:column; gap:12px; }
    .date{ font-size:30px; }
    .timeMain{ font-size:70px; }
    .timeSec{ font-size:26px; }
    .dicton{ font-size:46px; }
  }
</style>
</head>

<body>
  <div class="frame">
    <div class="card">
      <div class="content">
        <div class="topbar">
          <div class="date" id="date">—</div>
          <div class="badge">Dicton du jour</div>
        </div>

        <div class="clock">
          <div class="timeMain" id="timeMain">—</div>
          <div class="timeSec" id="timeSec">—</div>
        </div>

        <div class="rule"></div>

        <div class="quoteWrap">
          <div class="quoteMark">“</div>
          <div class="dicton" id="dicton">Chargement du dicton…</div>
        </div>

        <div class="meta">
          <span class="dot"></span>
          <span id="source">Source : saint-dicton.com</span>
        </div>
      </div>
    </div>
  </div>

<script>
  const TIMEZONE = "Europe/Paris";

  function updateTime(){
    const now = new Date();

    const dateText = new Intl.DateTimeFormat("fr-FR", {
      timeZone: TIMEZONE,
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    }).format(now);

    const timeText = new Intl.DateTimeFormat("fr-FR", {
      timeZone: TIMEZONE,
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    }).format(now);

    const parts = timeText.split(":");

    document.getElementById("date").textContent = dateText;
    document.getElementById("timeMain").textContent = parts[0] + ":" + parts[1];
    document.getElementById("timeSec").textContent = ":" + parts[2];
  }

  function startClock(){
    updateTime();

    function tick(){
      updateTime();
      const delay = 1000 - (Date.now() % 1000);
      setTimeout(tick, delay);
    }

    tick();
  }

  startClock();

  const DIC_KEY = "dicton_cache_v2";
  const DIC_TS = "dicton_cache_ts_v2";
  const TTL_MS = 3 * 60 * 60 * 1000;
  const FETCH_TIMEOUT_MS = 6000;

  function readCachedDicton(){
    try{
      const dic = localStorage.getItem(DIC_KEY);
      const ts = Number(localStorage.getItem(DIC_TS) || 0);

      if(!dic) return null;

      return { dic, ts };
    }catch(e){
      return null;
    }
  }

  function writeCachedDicton(dic){
    try{
      localStorage.setItem(DIC_KEY, dic);
      localStorage.setItem(DIC_TS, String(Date.now()));
    }catch(e){}
  }

  async function fetchWithTimeout(url, ms = FETCH_TIMEOUT_MS){
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), ms);

    try{
      return await fetch(url, {
        signal: controller.signal,
        cache: "no-store"
      });
    }finally{
      clearTimeout(timeout);
    }
  }

  async function fetchHtml(targetUrl){
    const urlWithCacheBuster = targetUrl + "?t=" + Date.now();

    const allOrigins = async () => {
      const r = await fetchWithTimeout(
        "https://api.allorigins.win/get?url=" + encodeURIComponent(urlWithCacheBuster)
      );

      if(!r.ok) throw new Error("Erreur AllOrigins");

      const json = await r.json();
      return json.contents;
    };

    const jina = async () => {
      const clean = urlWithCacheBuster.replace(/^https?:\/\//, "");

      const r = await fetchWithTimeout(
        "https://r.jina.ai/http://" + clean
      );

      if(!r.ok) throw new Error("Erreur Jina");

      return await r.text();
    };

    return await Promise.any([
      allOrigins(),
      jina()
    ]);
  }

  function htmlToText(html){
    const doc = new DOMParser().parseFromString(String(html), "text/html");
    const text = doc.body && doc.body.innerText ? doc.body.innerText : String(html);

    return text.replace(/\r/g, "");
  }

  function cleanDicton(text){
    return text
      .replace(/^-{3,}\s*$/gm, "")
      .replace(/[ \t]+\n/g, "\n")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  function extractDictonFromText(text){
    const lines = text
      .split("\n")
      .map(line => line.trim())
      .filter(Boolean);

    const index = lines.findIndex(line =>
      line.toLowerCase().includes("dicton du jour")
    );

    if(index === -1) return null;

    const stopWords = [
      "prénoms à fêter",
      "phase de la lune",
      "fêtes du",
      "saints du calendrier",
      "haut de la page"
    ];

    const result = [];

    for(let i = index + 1; i < lines.length; i++){
      const line = lines[i];
      const lower = line.toLowerCase();

      if(stopWords.some(word => lower.includes(word))) break;
      if(/^-{3,}$/.test(line)) continue;

      result.push(line);

      if(result.length >= 6) break;
    }

    const dicton = cleanDicton(result.join("\n"))
      .replace(/,([^\s])/g, ", $1");

    return dicton || null;
  }

  async function loadDicton(){
    const el = document.getElementById("dicton");
    const cached = readCachedDicton();

    if(cached && cached.dic){
      el.textContent = cached.dic;
    }else{
      el.textContent = "Chargement du dicton…";
    }

    if(cached && Date.now() - cached.ts < TTL_MS){
      return;
    }

    try{
      const html = await fetchHtml("https://www.saint-dicton.com/");
      const text = htmlToText(html);
      const dicton = extractDictonFromText(text);

      if(dicton){
        el.textContent = dicton;
        writeCachedDicton(dicton);
      }else if(!cached){
        el.textContent = "Dicton introuvable.";
      }
    }catch(error){
      if(!cached){
        el.textContent = "Impossible de charger le dicton.";
      }
    }
  }

  loadDicton();

  setInterval(loadDicton, 60 * 60 * 1000);

  setInterval(() => {
    window.location.reload();
  }, 10 * 60 * 1000);
</script>
</body>
</html>
