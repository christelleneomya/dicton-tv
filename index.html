<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Dicton du jour</title>

<link rel="preconnect" href="https://api.allorigins.win">
<link rel="preconnect" href="https://r.jina.ai">
<link rel="dns-prefetch" href="//api.allorigins.win">
<link rel="dns-prefetch" href="//r.jina.ai">

<style>
  :root{
    --bg:#fbf7f0;
    --bg2:#fffdf9;
    --ink:#2b231b;
    --muted:#7b6a5a;
    --line:#eadfd2;
    --accent:#b65c3a;
    --accent2:#d8a15f;
    --chip:#f3ede3;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:56px;
    background:
      radial-gradient(900px 520px at 12% 18%, rgba(216,161,95,.18), transparent 60%),
      radial-gradient(900px 520px at 88% 22%, rgba(182,92,58,.12), transparent 62%),
      linear-gradient(180deg, var(--bg), var(--bg2));
  }

  .frame{
    width:min(1500px, 96vw);
    border-radius:34px;
    padding:14px;
    background:linear-gradient(135deg, rgba(182,92,58,.55), rgba(216,161,95,.55));
    box-shadow:0 26px 70px rgba(43,35,27,.14);
  }

  .card{
    border-radius:26px;
    background:#ffffff; /* simplifié pour performance */
    border:1px solid rgba(234,223,210,.9);
    overflow:hidden;
    position:relative;
  }

  .content{
    position:relative;
    padding:44px 62px 38px;
    text-align:center;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    margin-bottom:18px;
  }

  .date{
    font-size:42px;
    font-weight:700;
    text-transform:lowercase;
  }

  .badge{
    font-size:16px;
    font-weight:800;
    letter-spacing:.8px;
    text-transform:uppercase;
    padding:10px 14px;
    border-radius:999px;
    background:var(--chip);
    border:1px solid rgba(234,223,210,1);
    color:var(--muted);
  }

  .clock{
    margin:20px auto 10px;
    display:inline-flex;
    align-items:baseline;
    justify-content:center;
    gap:12px;
    padding:18px 26px;
    border-radius:18px;
    background:rgba(243,237,227,.75);
    border:1px solid rgba(234,223,210,.95);
  }

  .timeMain{
    font-size:92px;
    font-weight:900;
  }

  .timeSec{
    font-size:34px;
    font-weight:800;
    color:var(--muted);
  }

  .rule{
    width:220px;
    height:6px;
    border-radius:99px;
    margin:26px auto 28px;
    background:linear-gradient(90deg, transparent, rgba(182,92,58,.30), rgba(216,161,95,.32), transparent);
  }

  .dicton{
    font-size:70px;
    font-weight:800;
    line-height:1.2;
    white-space:pre-line;
  }

  .meta{
    margin-top:22px;
    font-size:18px;
    color:var(--muted);
  }

  @media (max-width:1100px){
    body{ padding:26px; }
    .date{ font-size:30px; }
    .timeMain{ font-size:70px; }
    .timeSec{ font-size:26px; }
    .dicton{ font-size:46px; }
  }
</style>
</head>

<body>
  <div class="frame">
    <div class="card">
      <div class="content">

        <div class="topbar">
          <div class="date" id="date">—</div>
          <div class="badge">Dicton du jour</div>
        </div>

        <div class="clock">
          <div class="timeMain" id="timeMain">—</div>
          <div class="timeSec" id="timeSec">—</div>
        </div>

        <div class="rule"></div>

        <!-- TEXTE IMMÉDIAT pour éviter lenteur -->
        <div class="dicton" id="dicton">
          Belle journée à toutes et tous.
        </div>

        <div class="meta">
          Source : saint-dicton.com
        </div>

      </div>
    </div>
  </div>

<script>
  const TIMEZONE = "Europe/Paris";

  function updateTime(){
    const now = new Date();

    const dateText = new Intl.DateTimeFormat("fr-FR", {
      timeZone: TIMEZONE,
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    }).format(now);

    const timeText = new Intl.DateTimeFormat("fr-FR", {
      timeZone: TIMEZONE,
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    }).format(now);

    const parts = timeText.split(":");

    document.getElementById("date").textContent = dateText;
    document.getElementById("timeMain").textContent = parts[0] + ":" + parts[1];
    document.getElementById("timeSec").textContent = ":" + parts[2];
  }

  function startClock(){
    function tick(){
      updateTime();
      setTimeout(tick, 1000 - (Date.now() % 1000));
    }
    tick();
  }

  startClock();

  // -------- CACHE DICton --------
  const KEY = "dicton_cache";
  const TS = "dicton_ts";
  const TTL = 6 * 60 * 60 * 1000;

  function getCache(){
    try{
      return {
        text: localStorage.getItem(KEY),
        ts: Number(localStorage.getItem(TS) || 0)
      };
    }catch{ return null; }
  }

  function setCache(text){
    localStorage.setItem(KEY, text);
    localStorage.setItem(TS, Date.now());
  }

  async function loadDicton(){
    const el = document.getElementById("dicton");
    const cache = getCache();

    if(cache && cache.text){
      el.textContent = cache.text;
    }

    if(cache && Date.now() - cache.ts < TTL){
      return;
    }

    try{
      const r = await fetch("https://api.allorigins.win/get?url=" + encodeURIComponent("https://www.saint-dicton.com/"));
      const j = await r.json();

      const text = new DOMParser()
        .parseFromString(j.contents, "text/html")
        .body.innerText;

      const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
      const i = lines.findIndex(l => l.toLowerCase().includes("dicton du jour"));

      if(i !== -1){
        const dicton = lines.slice(i+1, i+4).join("\n");
        el.textContent = dicton;
        setCache(dicton);
      }

    }catch(e){
      console.log("Erreur dicton", e);
    }
  }

  loadDicton();

  // refresh léger
  setInterval(loadDicton, 60 * 60 * 1000);

  // reload complet toutes les 10 min (important pour player)
  setInterval(() => location.reload(), 10 * 60 * 1000);

</script>
</body>
</html>
